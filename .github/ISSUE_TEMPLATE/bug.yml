name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: tonearm
    attributes:
      label: Tonearm version
      description: Shown in Finder → Get Info on Tonearm.app.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.1"
    validations:
      required: true
  - type: input
    id: spotify
    attributes:
      label: Spotify version
      description: Spotify → About Spotify.
      placeholder: "1.2.50"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
