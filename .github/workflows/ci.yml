name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and snapshot
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version && sw_vers
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/build-app.sh
      - name: Render snapshot
        run: |
          mkdir -p build/snapshots
          build/Tonearm.app/Contents/MacOS/Tonearm --snapshot build/snapshots/player.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: build/snapshots/
          retention-days: 14
      - name: Zip app
        run: ditto -c -k --keepParent build/Tonearm.app build/Tonearm.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tonearm-app
          path: build/Tonearm.zip
          retention-days: 14
