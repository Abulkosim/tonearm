name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and snapshot
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version && sw_vers
      - name: Test
        run: swift test
      - name: Build app
        run: |
          mkdir -p build
          scripts/build-app.sh 2>&1 | tee build/build.log
      - name: Report warnings
        run: scripts/swift-warnings.sh build/build.log
      - name: Check app bundle and launch it
        run: EXPECT_SIGNING=adhoc scripts/check-app.sh build/Tonearm.app
      # Starts the real app, which starts Sparkle, and checks it is still running after 10 s.
      - name: Live launch
        run: |
          start="$(date '+%Y-%m-%d %H:%M:%S')"
          open -n build/Tonearm.app
          sleep 10
          pgrep -x Tonearm > /dev/null || { echo "::error::Tonearm exited during the live launch"; exit 1; }
          pkill -x Tonearm || true
          log show --start "$start" --style compact \
            --predicate 'process == "Tonearm" AND (subsystem BEGINSWITH "org.sparkle-project" OR eventMessage CONTAINS[c] "sparkle")' \
            | tail -n 40 || true
      - name: Render snapshots
        run: |
          build/Tonearm.app/Contents/MacOS/Tonearm --snapshot build/snapshots
          ls -l build/snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: build/snapshots/
          if-no-files-found: error
          retention-days: 14
      - name: Package
        run: scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tonearm-app
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # The release path for the SELF_SIGN_CERT_P12 secret, with a throwaway certificate:
  # import and trust it, sign inside-out, check the designated requirement, launch.
  self-signed:
    name: Self-signed build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make and import a throwaway certificate
        env:
          CERT_IDENTITY: Tonearm Self-Signed
          TRUST_CERT: "true"
        run: |
          P12_PASSWORD="$(openssl rand -hex 16)"
          export P12_PASSWORD
          scripts/make-self-signed-cert.sh "$RUNNER_TEMP/cert"
          CERT_P12="$(base64 < "$RUNNER_TEMP/cert/tonearm-self-signed.p12" | tr -d '\n')" \
            CERT_PASSWORD="$P12_PASSWORD" scripts/import-signing-cert.sh
          rm -rf "$RUNNER_TEMP/cert"
      - name: Build app
        env:
          SIGN_IDENTITY: Tonearm Self-Signed
        run: scripts/build-app.sh
      - name: Check app bundle and launch it
        run: EXPECT_SIGNING=self-signed scripts/check-app.sh build/Tonearm.app
      - name: Package
        env:
          SIGN_IDENTITY: Tonearm Self-Signed
        run: scripts/package.sh
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/tonearm-signing.keychain-db" || true

  lint:
    name: Scripts and release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck --version && shellcheck scripts/*.sh
      - name: Release notes for the current version
        run: |
          version="$(grep -A1 '<key>CFBundleShortVersionString</key>' Resources/Info.plist \
            | sed -n 's:.*<string>\(.*\)</string>.*:\1:p')"
          scripts/check-release.sh "v$version"
