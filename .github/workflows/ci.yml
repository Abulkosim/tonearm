name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and snapshot
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version && sw_vers
      - name: Test
        run: swift test
      - name: Build app
        run: |
          mkdir -p build
          scripts/build-app.sh 2>&1 | tee build/build.log
      - name: Report warnings
        run: scripts/swift-warnings.sh build/build.log
      - name: Render snapshot
        run: |
          mkdir -p build/snapshots
          build/Tonearm.app/Contents/MacOS/Tonearm --snapshot build/snapshots/player.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: build/snapshots/
          if-no-files-found: error
          retention-days: 14
      - name: Package
        run: scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tonearm-app
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  lint:
    name: Scripts and release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck --version && shellcheck scripts/*.sh
      - name: Release notes for the current version
        run: |
          version="$(grep -A1 '<key>CFBundleShortVersionString</key>' Resources/Info.plist \
            | sed -n 's:.*<string>\(.*\)</string>.*:\1:p')"
          scripts/check-release.sh "v$version"
