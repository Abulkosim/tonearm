name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and snapshot
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version && sw_vers
      - name: Test
        run: |
          mkdir -p build
          swift test 2>&1 | tee build/test.log
      - name: Build app
        run: scripts/build-app.sh 2>&1 | tee build/build.log
      # Compiler warnings in the app and the tests, and linker warnings, fail the job.
      - name: Report warnings
        run: scripts/swift-warnings.sh build/test.log build/build.log
      - name: Check app bundle and launch it
        run: EXPECT_SIGNING=adhoc scripts/check-app.sh build/Tonearm.app
      # Starts the real app, which starts Sparkle, and for 10 s checks that it is running and
      # that its main thread answers an Apple Event within 5 s.
      - name: Live launch
        run: scripts/live-launch.sh build/Tonearm.app
      # Liner Notes: Tonearm's stats against a slow Python twin on a synthetic Spotify
      # export, for many periods and time zones, then speed. See scripts/history-twin.py.
      - name: Liner Notes twin
        run: |
          python3 scripts/make-history-fixture.py build/history/export --zip build/history/export.zip
          python3 scripts/history-twin.py check --app build/Tonearm.app/Contents/MacOS/Tonearm \
            --fixture build/history/export --zip build/history/export.zip --work build/history
      - name: Liner Notes speed
        run: python3 scripts/history-twin.py bench --app build/Tonearm.app/Contents/MacOS/Tonearm --work build/history
      # The Liner Notes window and share card from the fixture: every period, empty, importing,
      # light and dark. Fails if share card text would be under 4.5:1. See LinerNotesSnapshot.
      - name: Render Liner Notes
        run: build/Tonearm.app/Contents/MacOS/Tonearm --liner-notes build/liner-notes --history build/history/export
      # The real window in the running app, with the fixture as the runner's own history: no
      # window may open by itself at launch, and --open-liner-notes must open one.
      - name: Liner Notes window, live
        run: scripts/liner-notes-live.sh build/Tonearm.app build/history/export build/liner-notes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: liner-notes
          path: build/liner-notes/
          if-no-files-found: error
          retention-days: 14
      - name: Render snapshots
        run: |
          build/Tonearm.app/Contents/MacOS/Tonearm --snapshot build/snapshots
          ls -l build/snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: build/snapshots/
          if-no-files-found: error
          retention-days: 14
      # Every screen in every state, plus contact-sheet.png. Fails if a state is clipped.
      - name: Render every state
        run: build/Tonearm.app/Contents/MacOS/Tonearm --states build/states
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: states
          path: build/states/
          if-no-files-found: error
          retention-days: 14
      - name: Package
        run: scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tonearm-app
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # The release path for the SELF_SIGN_CERT_P12 secret, with a throwaway certificate:
  # import and trust it, sign inside-out, check the designated requirement, launch.
  self-signed:
    name: Self-signed build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make and import a throwaway certificate
        env:
          CERT_IDENTITY: Tonearm Self-Signed
          TRUST_CERT: "true"
        run: |
          P12_PASSWORD="$(openssl rand -hex 16)"
          export P12_PASSWORD
          scripts/make-self-signed-cert.sh "$RUNNER_TEMP/cert"
          CERT_P12="$(base64 < "$RUNNER_TEMP/cert/tonearm-self-signed.p12" | tr -d '\n')" \
            CERT_PASSWORD="$P12_PASSWORD" scripts/import-signing-cert.sh
          rm -rf "$RUNNER_TEMP/cert"
      - name: Build app
        env:
          SIGN_IDENTITY: Tonearm Self-Signed
        run: scripts/build-app.sh
      - name: Check app bundle and launch it
        run: EXPECT_SIGNING=self-signed scripts/check-app.sh build/Tonearm.app
      # The build users get: start the real app, with Sparkle, and check for 10 s that it is up
      # and its main thread answers.
      - name: Live launch
        run: scripts/live-launch.sh build/Tonearm.app
      - name: Launch gate rejects the v0.3.0 signing
        env:
          SIGN_IDENTITY: Tonearm Self-Signed
        run: scripts/launch-gate-test.sh build/Tonearm.app
      - name: Package
        env:
          SIGN_IDENTITY: Tonearm Self-Signed
        run: scripts/package.sh
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/tonearm-signing.keychain-db" || true

  lint:
    name: Scripts and release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck --version && shellcheck scripts/*.sh
      - name: Release notes for the current version
        run: |
          version="$(grep -A1 '<key>CFBundleShortVersionString</key>' Resources/Info.plist \
            | sed -n 's:.*<string>\(.*\)</string>.*:\1:p')"
          scripts/check-release.sh "v$version"
