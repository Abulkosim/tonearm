name: Demo

# Renders docs/images/demo.gif, the README animation. Download the artifact and
# commit it when the player's look changes.
on:
  pull_request:
    paths:
      - Sources/Tonearm/Snapshot.swift
      - scripts/make-demo.sh
      - .github/workflows/demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: Render demo
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build app
        run: scripts/build-app.sh
      - name: Install gifski
        run: brew install gifski
      - name: Render
        run: scripts/make-demo.sh build/demo.gif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo
          path: |
            build/demo.gif
            build/demo-frames/frame-0001.png
            build/demo-frames/frame-0028.png
            build/demo-frames/frame-0031.png
            build/demo-frames/frame-0061.png
            build/demo-frames/frame-0091.png
          if-no-files-found: error
          retention-days: 14
