name: E2E

# Runs Tonearm against a fake Spotify (Tools/FakeSpotify) through real AppleScript, and
# checks the fake's dictionary against the real Spotify app's. See CONTRIBUTING.md.
on:
  pull_request:
    paths:
      - Sources/**
      - Tools/**
      - scripts/e2e.sh
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  e2e:
    name: Fake Spotify end to end
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build app
        run: scripts/build-app.sh
      - name: Run scenarios
        run: scripts/e2e.sh
      - name: Summary
        if: always()
        run: |
          if [ -f build/e2e/report/report.txt ]; then
            {
              echo '```'
              grep -E '^(FAIL|==|[0-9]+ checks)' build/e2e/report/report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-logs
          path: build/e2e/report/
          if-no-files-found: warn
          retention-days: 14

  # The real dictionary is read on the runner and never stored or uploaded.
  dictionary:
    name: Fake matches Spotify's dictionary
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Spotify
        id: install
        run: |
          if HOMEBREW_NO_AUTO_UPDATE=1 brew install --cask spotify; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::brew install --cask spotify failed; the dictionary check is skipped"
            echo "Dictionary check skipped: the Spotify cask did not install." >> "$GITHUB_STEP_SUMMARY"
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare dictionaries
        if: steps.install.outputs.installed == 'true'
        run: |
          version="$(defaults read /Applications/Spotify.app/Contents/Info.plist CFBundleShortVersionString)"
          echo "Spotify $version"
          sdef /Applications/Spotify.app > "$RUNNER_TEMP/spotify.sdef"
          python3 Tools/FakeSpotify/check-sdef.py "$RUNNER_TEMP/spotify.sdef" Tools/FakeSpotify/Spotify.sdef \
            | tee "$RUNNER_TEMP/check.txt"
          echo "Dictionary checked against Spotify $version: $(tail -n 1 "$RUNNER_TEMP/check.txt")" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/spotify.sdef"
