name: E2E

# Runs Tonearm against a fake Spotify (Tools/FakeSpotify) through real AppleScript, and
# checks the fake's dictionary against the real Spotify app's. See CONTRIBUTING.md.
#
# Pull requests run it when they touch the app, its build, or this test. Pushes to main and
# a weekly run always do, so a Spotify update that changes its dictionary shows up without
# a pull request. On pull requests that touch none of those files the two jobs are skipped,
# which counts as passing, so "E2E with fake Spotify" can be a required check.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Runs on main get a group per commit: with one group, a run waiting behind another is
# replaced by the next one, and scripts/require-ci.sh refuses a commit whose check never ran.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: E2E needed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.files.outputs.run }}
    steps:
      - name: List changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
          echo "$files"
          pattern='^(Sources/|Tools/|Resources/|Package\.(swift|resolved)$|scripts/(e2e|build-app|idle-cost)\.sh$|\.github/workflows/e2e\.yml$)'
          if grep -qE "$pattern" <<< "$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # If the changes job fails, both jobs below still run rather than skip and pass.
  e2e:
    name: E2E with fake Spotify
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build app
        run: scripts/build-app.sh
      - name: Run scenarios
        run: TONEARM_APP=build/Tonearm.app scripts/e2e.sh
      # The real app with the player closed, 60 s each with Spotify not running, paused and
      # playing: CPU time, wakeups and reads against a budget. Uses the fake from the step above.
      - name: Idle cost
        run: scripts/idle-cost.sh build/Tonearm.app build/e2e/report
      - name: Summary
        if: always()
        run: |
          if [ -f build/e2e/report/report.txt ]; then
            {
              echo '```'
              grep -E '^(FAIL|==|[0-9]+ checks)' build/e2e/report/report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-logs
          path: build/e2e/report/
          if-no-files-found: warn
          retention-days: 14

  # The real dictionary is read on the runner and never stored or uploaded. If the Spotify
  # cask does not install, the job fails: a green job here means the check ran.
  dictionary:
    name: Fake matches Spotify's dictionary
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SPOTIFY_CASK: spotify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Spotify
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install --cask "$SPOTIFY_CASK"
      - name: Compare dictionaries
        run: |
          version="$(defaults read /Applications/Spotify.app/Contents/Info.plist CFBundleShortVersionString)"
          echo "Spotify $version"
          sdef /Applications/Spotify.app > "$RUNNER_TEMP/spotify.sdef"
          python3 Tools/FakeSpotify/check-sdef.py "$RUNNER_TEMP/spotify.sdef" Tools/FakeSpotify/Spotify.sdef \
            | tee "$RUNNER_TEMP/check.txt"
          echo "Dictionary checked against Spotify $version: $(tail -n 1 "$RUNNER_TEMP/check.txt")" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/spotify.sdef"
