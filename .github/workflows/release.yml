name: Release

# Tag push vX.Y.Z: build, sign, notarize when secrets exist, package, write the Sparkle
# appcast, attest and publish.
# workflow_dispatch and pull requests that touch release files: dry run that only uploads artifacts.
#
# Signing, first match wins (see docs/releasing.md):
#   MACOS_CERT_P12 ...      Developer ID, notarized when notary secrets exist too
#   SELF_SIGN_CERT_P12 ...  "Tonearm Self-Signed" certificate
#   nothing                 ad-hoc
# SPARKLE_ED_PRIVATE_KEY signs the update for the appcast. Without it a release has no appcast.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-app.sh
      - scripts/package.sh
      - scripts/notarize.sh
      - scripts/import-signing-cert.sh
      - scripts/check-release.sh
      - scripts/build-number.sh
      - scripts/check-app.sh
      - scripts/sparkle-tools.sh
      - scripts/appcast.sh
      - scripts/verify-appcast.sh
      - scripts/ed25519-public-key.sh
      - Package.swift
      - Package.resolved
      - Resources/Info.plist
      - Resources/Tonearm.entitlements
  workflow_dispatch:
    inputs:
      version:
        description: Version for the dry-run file names, for example 0.0.0-test
        required: true
        default: 0.0.0-test
      sign:
        description: Sign, notarize and sign the appcast with the repository secrets, if they exist
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$EVENT" in
            push)
              scripts/check-release.sh "$REF_NAME"
              version="${REF_NAME#v}"
              publish=true
              ;;
            workflow_dispatch)
              version="$INPUT_VERSION"
              publish=false
              ;;
            *)
              version="0.0.0-pr.$PR_NUMBER"
              publish=false
              ;;
          esac
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::invalid version: $version"
            exit 1
          fi
          build="$(scripts/build-number.sh "$version")"
          {
            echo "version=$version"
            echo "build=$build"
            echo "tag=v$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (build $build), publish: $publish" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and package
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      signing: ${{ steps.signing.outputs.mode }}
      appcast: ${{ steps.appcast.outputs.mode }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # major*10000 + minor*100 + patch; Sparkle compares it to find newer versions.
      BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version && sw_vers
      # Secrets reach this job only for tag pushes, or a manual run with sign enabled.
      - name: Signing mode
        id: signing
        env:
          ALLOWED: ${{ github.event_name == 'push' || inputs.sign == true }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SELF_SIGN_CERT_P12: ${{ secrets.SELF_SIGN_CERT_P12 }}
          SELF_SIGN_CERT_PASSWORD: ${{ secrets.SELF_SIGN_CERT_PASSWORD }}
        run: |
          mode=adhoc
          if [ "$ALLOWED" = true ] && [ -n "$MACOS_CERT_P12" ]; then
            if [ -z "$MACOS_CERT_PASSWORD" ] || [ -z "$MACOS_SIGN_IDENTITY" ]; then
              echo "::error::MACOS_CERT_P12 is set but MACOS_CERT_PASSWORD or MACOS_SIGN_IDENTITY is missing"
              exit 1
            fi
            mode=developer-id
            if [ -n "$NOTARY_KEY_P8" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER_ID" ]; then
              mode=notarized
            elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
              mode=notarized
            fi
          elif [ "$ALLOWED" = true ] && [ -n "$SELF_SIGN_CERT_P12" ]; then
            if [ -z "$SELF_SIGN_CERT_PASSWORD" ]; then
              echo "::error::SELF_SIGN_CERT_P12 is set but SELF_SIGN_CERT_PASSWORD is missing"
              exit 1
            fi
            mode=self-signed
          fi
          if [ "$mode" = adhoc ] && [ "$ALLOWED" = true ]; then
            echo "::warning::No signing secrets: ad-hoc signature. macOS will ask again for the Spotify permission after every update."
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Signing: $mode" >> "$GITHUB_STEP_SUMMARY"
          echo "signing: $mode"
      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'developer-id' || steps.signing.outputs.mode == 'notarized'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          CERT_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: scripts/import-signing-cert.sh
      - name: Import self-signed certificate
        if: steps.signing.outputs.mode == 'self-signed'
        env:
          CERT_P12: ${{ secrets.SELF_SIGN_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SELF_SIGN_CERT_PASSWORD }}
          CERT_IDENTITY: Tonearm Self-Signed
          TRUST_CERT: "true"
        run: scripts/import-signing-cert.sh
      - name: Build app
        env:
          SIGN_IDENTITY: ${{ (steps.signing.outputs.mode == 'developer-id' || steps.signing.outputs.mode == 'notarized') && secrets.MACOS_SIGN_IDENTITY || (steps.signing.outputs.mode == 'self-signed' && 'Tonearm Self-Signed' || '-') }}
        run: scripts/build-app.sh
      - name: Package
        env:
          SIGN_IDENTITY: ${{ (steps.signing.outputs.mode == 'developer-id' || steps.signing.outputs.mode == 'notarized') && secrets.MACOS_SIGN_IDENTITY || (steps.signing.outputs.mode == 'self-signed' && 'Tonearm Self-Signed' || '-') }}
          NOTARIZE: ${{ steps.signing.outputs.mode == 'notarized' }}
          APPLE_ID: ${{ steps.signing.outputs.mode == 'notarized' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.mode == 'notarized' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_PASSWORD: ${{ steps.signing.outputs.mode == 'notarized' && secrets.APPLE_APP_PASSWORD || '' }}
          NOTARY_KEY_P8: ${{ steps.signing.outputs.mode == 'notarized' && secrets.NOTARY_KEY_P8 || '' }}
          NOTARY_KEY_ID: ${{ steps.signing.outputs.mode == 'notarized' && secrets.NOTARY_KEY_ID || '' }}
          NOTARY_ISSUER_ID: ${{ steps.signing.outputs.mode == 'notarized' && secrets.NOTARY_ISSUER_ID || '' }}
        run: scripts/package.sh
      - name: Inspect packaged app
        env:
          SIGNING: ${{ steps.signing.outputs.mode }}
        run: |
          check="$(mktemp -d)"
          ditto -x -k "dist/Tonearm-$VERSION.zip" "$check"
          case "$SIGNING" in notarized) expect=developer-id ;; *) expect="$SIGNING" ;; esac
          EXPECT_VERSION="$VERSION" EXPECT_BUILD="$BUILD" EXPECT_SIGNING="$expect" \
            scripts/check-app.sh "$check/Tonearm.app"
          cmp "dist/Tonearm-$VERSION.zip" dist/Tonearm.zip
          cmp "dist/Tonearm-$VERSION.dmg" dist/Tonearm.dmg
      - name: Sparkle tools
        run: scripts/sparkle-tools.sh build/sparkle
      # Signs the versioned zip, the file Sparkle downloads. Dry runs without the key sign
      # with a throwaway key so the tools and the checks still run.
      - name: Appcast
        id: appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ (github.event_name == 'push' || inputs.sign == true) && secrets.SPARKLE_ED_PRIVATE_KEY || '' }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          export OPENSSL
          public_key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' build/Tonearm.app/Contents/Info.plist)"
          if [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then
            mode=signed
          elif [ "$PUBLISH" = true ]; then
            mode=skipped
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set: this release has no appcast.xml, so installed copies will not see it as an update. See docs/releasing.md."
          else
            mode=dry-run
            SPARKLE_ED_PRIVATE_KEY="$("$OPENSSL" rand -base64 32)"
            echo "::add-mask::$SPARKLE_ED_PRIVATE_KEY"
            public_key="$(SEED="$SPARKLE_ED_PRIVATE_KEY" scripts/ed25519-public-key.sh)"
            echo "dry run: signing with a throwaway key, public key $public_key"
            # Use the notes of the version in Info.plist so the markdown path runs too.
            NOTES_FILE="changelogs/v$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist).md"
            export NOTES_FILE
          fi
          if [ "$mode" != skipped ]; then
            SPARKLE_ED_PRIVATE_KEY="$SPARKLE_ED_PRIVATE_KEY" SPARKLE_PUBLIC_KEY="$public_key" \
              SIGN_UPDATE=build/sparkle/bin/sign_update \
              scripts/appcast.sh "dist/Tonearm-$VERSION.zip" dist/appcast.xml
            cat dist/appcast.xml
            (cd dist && shasum -a 256 appcast.xml >> SHA256SUMS.txt)
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Appcast: $mode" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing keychain
        if: always() && steps.signing.outputs.mode != 'adhoc'
        run: security delete-keychain "$RUNNER_TEMP/tonearm-signing.keychain-db" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' && github.repository == 'Abulkosim/tonearm'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ github.ref_name }}
      SIGNING: ${{ needs.build.outputs.signing }}
      APPCAST: ${{ needs.build.outputs.appcast }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: dist/
      - name: Verify checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum -c SHA256SUMS.txt
      # Checks the signature again, on Linux, against the public key in the tagged Info.plist.
      - name: Verify appcast
        run: |
          case "$APPCAST" in
            signed)
              public_key="$(grep -A1 '<key>SUPublicEDKey</key>' Resources/Info.plist \
                | sed -n 's:.*<string>\(.*\)</string>.*:\1:p')"
              scripts/verify-appcast.sh dist/appcast.xml "dist/Tonearm-$VERSION.zip" "$public_key"
              ;;
            skipped)
              echo "::warning::No appcast.xml: SPARKLE_ED_PRIVATE_KEY was not set. Installed copies will not update to $TAG."
              ;;
            *)
              echo "::error::unexpected appcast mode '$APPCAST'"
              exit 1
              ;;
          esac
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Write release notes
        run: |
          {
            cat "changelogs/$TAG.md"
            echo
            echo "## Install"
            echo
            echo "Download \`Tonearm-$VERSION.dmg\`, open it and drag Tonearm to Applications. Needs macOS 13 or later and the Spotify desktop app."
            echo
            case "$SIGNING" in
              notarized)
                echo "Signed with a Developer ID and notarized by Apple."
                ;;
              developer-id)
                echo "Signed with a Developer ID. **Not notarized**, so macOS blocks the first launch: open Tonearm once, then go to System Settings > Privacy & Security and click Open Anyway."
                ;;
              self-signed)
                echo "**Not notarized.** Tonearm is signed with its own certificate, not an Apple Developer ID, so macOS blocks the first launch. Open Tonearm once, then go to System Settings > Privacy & Security and click Open Anyway. On macOS 13 and 14 you can also Control-click Tonearm in Applications and choose Open."
                echo
                echo "You do this once. After that, Tonearm installs updates by itself, and every version is signed with the same certificate, so macOS keeps the permission to control Spotify."
                ;;
              *)
                echo "**Not notarized.** This build is ad-hoc signed, not signed with an Apple Developer ID, so macOS blocks the first launch. Open Tonearm once, then go to System Settings > Privacy & Security and click Open Anyway. On macOS 13 and 14 you can also Control-click Tonearm in Applications and choose Open."
                echo
                echo "macOS may ask again for permission to control Spotify after you update to a new version."
                ;;
            esac
            echo
            echo "Check the download with \`shasum -a 256 -c SHA256SUMS.txt\` or \`gh attestation verify Tonearm-$VERSION.dmg --repo $GITHUB_REPOSITORY\`."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::release $TAG already exists; ship a new patch version instead"
            exit 1
          fi
          files=("dist/Tonearm-$VERSION.dmg" "dist/Tonearm-$VERSION.zip" dist/Tonearm.dmg dist/Tonearm.zip dist/SHA256SUMS.txt)
          if [ "$APPCAST" = signed ]; then
            files+=(dist/appcast.xml)
          fi
          # --latest moves releases/latest/download/{appcast.xml,Tonearm.dmg} to this release.
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Tonearm $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${files[@]}"
